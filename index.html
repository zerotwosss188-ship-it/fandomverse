<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ⭐ Primary Meta Tags -->
    <title>FandomVerse — Portal for Fandom World</title>
    <meta
      name="title"
      content="FandomVerse — Portal for Fandom World"
    />
    <meta
      name="description"
      content="FandomVerse — your unified hub for Anime, Gaming, Movies, TV Shows, K-Pop, Comics, and Manga. Discover articles, characters, trailers, events, and merchandise in one place."
    />
    <meta
      name="keywords"
      content="anime, gaming, movies, tv shows, k-pop, comics, manga, fandom, trailers, characters, merchandise"
    />
    <meta name="author" content="FandomVerse Team" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="robots" content="index, follow" />

    <!-- ⭐ Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="FandomVerse — Portal for Fandom World"
    />
    <meta
      property="og:description"
      content="Your unified hub for Anime, Gaming, Movies, TV Shows, K-Pop, Comics, and Manga — all in one place."
    />
    <meta property="og:image" content="/images/Logo/tab-logo.png" />
    <meta property="og:site_name" content="FandomVerse" />

    <!-- ⭐ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FandomVerse — Portal for Fandom World"
    />
    <meta
      name="twitter:description"
      content="Your unified hub for Anime, Gaming, Movies, TV Shows, K-Pop, Comics, and Manga."
    />
    <meta name="twitter:image" content="/images/Logo/tab-logo.png" />

    <!-- ⭐ Favicon -->
    <link rel="icon" type="image/png" href="/images/Logo/tab-logo.png" />
    <link rel="apple-touch-icon" href="/images/Logo/tab-logo.png" />

    <!-- ⭐ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ⭐ API Preconnects (image CDNs and data sources) -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://img.youtube.com" />
    <link rel="preconnect" href="https://upload.wikimedia.org" />

    <!-- ⭐ DNS Prefetch (defer until needed) -->
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />
    <link rel="dns-prefetch" href="https://kitsu.io" />
    <link rel="dns-prefetch" href="https://en.wikipedia.org" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
